[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
    { run = 'nano "$@"', block = true, desc = "Nano" },
    { run = 'code "$@"', desc = "VSCode" },
    { run = 'gnome-text-editor "$@"', desc = "GNOME Text Editor" },

]


[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
]
[mgr]
show_hidden = true
sort_by = "btime"
sort_reverse = true   # true = newest first

